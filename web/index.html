<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arm Studio</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-y: hidden
        }

        #content {
            width: 100%;
            height: 100%;
        }

        .div_loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
        }

        .lds-spinner {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
        }

        .lds-spinner div {
            transform-origin: 40px 40px;
            animation: lds-spinner 1.2s linear infinite;
        }

        .lds-spinner div:after {
            content: " ";
            display: block;
            position: absolute;
            top: 3px;
            left: 37px;
            width: 6px;
            height: 18px;
            border-radius: 20%;
            background: darkslategray;
        }

        .div_loading h4 {
            color: darkslategray;
        }

        /* The theme is applied before the bundle runs, so the loading screen can follow it. These
           three colours are a copy of the ones in src/theme.css for the same reason, and are
           written out rather than read from a variable that does not exist yet. */
        html[data-theme="dark"] {
            background-color: #141414;
        }

        html[data-theme="dark"] .lds-spinner div:after {
            background: #6b6b6b;
        }

        html[data-theme="dark"] .div_loading h4 {
            color: #d0d0d0;
        }

        .lds-spinner div:nth-child(1) {
            transform: rotate(0deg);
            animation-delay: -1.1s;
        }

        .lds-spinner div:nth-child(2) {
            transform: rotate(30deg);
            animation-delay: -1s;
        }

        .lds-spinner div:nth-child(3) {
            transform: rotate(60deg);
            animation-delay: -0.9s;
        }

        .lds-spinner div:nth-child(4) {
            transform: rotate(90deg);
            animation-delay: -0.8s;
        }

        .lds-spinner div:nth-child(5) {
            transform: rotate(120deg);
            animation-delay: -0.7s;
        }

        .lds-spinner div:nth-child(6) {
            transform: rotate(150deg);
            animation-delay: -0.6s;
        }

        .lds-spinner div:nth-child(7) {
            transform: rotate(180deg);
            animation-delay: -0.5s;
        }

        .lds-spinner div:nth-child(8) {
            transform: rotate(210deg);
            animation-delay: -0.4s;
        }

        .lds-spinner div:nth-child(9) {
            transform: rotate(240deg);
            animation-delay: -0.3s;
        }

        .lds-spinner div:nth-child(10) {
            transform: rotate(270deg);
            animation-delay: -0.2s;
        }

        .lds-spinner div:nth-child(11) {
            transform: rotate(300deg);
            animation-delay: -0.1s;
        }

        .lds-spinner div:nth-child(12) {
            transform: rotate(330deg);
            animation-delay: 0s;
        }

        @keyframes lds-spinner {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
    <script>
        // Applied before the bundle loads so a dark user sees no white flash. Mirrors
        // utils/theme.js, which takes over once React is up.
        (function () {
            var stored = null;
            try {
                stored = localStorage.getItem('THEME_PREFERENCE');
            } catch (e) {
                // localStorage can be unavailable; fall back to the OS below.
            }
            var dark = stored === 'dark' || (stored !== 'light'
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
</head>
<body>
<div id="content">
    <!--display loading when dom rendering-->
    <!--https://stackoverflow.com/questions/40987309/react-display-loading-screen-while-dom-is-rendering-->
    <!--https://loading.io/css/-->
    <!--https://code-examples.net/zh-CN/q/570780-->
    <div class="div_loading">
        <div class="lds-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <h4>Loading...</h4>
    </div>
</div>
<script type="text/javascript" src="bundle.js"></script>
</body>
</html>
